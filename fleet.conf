# fleet.conf - app manifest, sourced by the bin/ lifecycle scripts.
NAME="Echo Template"
PORT="8080"
# Relative to the app root: the fleet prefixes $BASE_PATH itself.
HEALTH_PATH="/health"
INSTALL_CMD='go mod download'
BUILD_CMD='go build -o ./.bin/app ./cmd/app'
START_CMD='env PORT="$PORT" BASE_PATH="$BASE_PATH" ./.bin/app'
RELOAD_CMD=''

# START_CMD uses `env VAR=...` rather than a bare `VAR=... cmd`: the start
# step is exec'd, and exec cannot take a leading assignment.
